name: Deploy to GitHub Pages

on:
  push:
    branches: [ "master" ] # или "master", если у тебя основная ветка master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Забираем код
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 3️⃣ Устанавливаем pnpm (официальный экшен)
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # 4️⃣ Устанавливаем зависимости
      - name: Install dependencies
        run: pnpm install

      # 5️⃣ Строим проект
      - name: Build project
        run: pnpm run build

      # 6️⃣ Проверяем наличие dist/index.html
      - name: Verify build contents
        run: |
          echo "=== dist folder contents ==="
          ls dist/
          if [ -f "dist/index.html" ]; then
            echo "✅ index.html found!"
          else
            echo "❌ index.html NOT found!"
            exit 1
          fi

      # 7️⃣ Настраиваем GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v3

      # 8️⃣ Загружаем собранный артефакт
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./dist

      # 9️⃣ Деплой на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

